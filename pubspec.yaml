name: za3ma_ndoubel
description: "Application de calcul de notes."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_svg: ^2.0.10
  http: ^1.2.1
  shared_preferences: ^2.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#2C1A0E"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

  flutter_lints: ^5.0.0


flutter:

  uses-material-design: true


